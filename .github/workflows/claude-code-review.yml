name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write (not read) so the review can actually be posted: the code-review
      # plugin uses `gh pr comment` and the inline-comment MCP tool.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMPORARY - diagnostic only, revert before merging. The action hides
          # the SDK's output by default, which also hides why the run fails. This
          # workflow has never completed successfully, so there is no known-good
          # output to compare against; turning it on is the only way to see the
          # actual error. Public repo: read the log before leaving this on.
          show_full_output: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required. Without it the plugin prints the review to the
          # runner's stdout and explicitly stops before posting anything.
          prompt: '/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --allowedTools REPLACES the default allowlist, so this must be a
          # superset of everything the review needs. Two groups matter:
          #   - posting: the inline-comment MCP tool + `gh pr comment`. Neither is
          #     in the action's defaults, so omitting this flag entirely means the
          #     review runs and then silently posts nothing.
          #   - working: Task (the 4 parallel review agents), Read/Grep/Glob,
          #     TodoWrite, and git history for the blame-based agent.
          claude_args: |
            --allowedTools "Task,Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
