# Blocks credentials from reaching the repository through a pull request.
#
# Unlike sportscard-intelligence (private repo, where this workflow pattern
# originated), airhead-calendar is PUBLIC, so GitHub's native protections are
# on and free. Verified 2026-08-07 via
# `gh api repos/kyleswiger/airhead-calendar -q .security_and_analysis`:
#
#   secret_scanning:                 enabled
#   secret_scanning_push_protection: enabled
#
# So native push protection is the first line - it rejects provider-formatted
# tokens at push time, before the object reaches the remote. This workflow is
# the second line, and it earns its keep twice over:
#
#   1. It is a pre-merge BLOCKING check (native scanning alerts, it does not
#      gate merges), wired into the branch ruleset as `Scan for committed
#      credentials`.
#   2. .gitleaks.toml extends gitleaks' default ruleset (which covers classes
#      native scanning misses, e.g. generic high-entropy strings) and is where
#      any allowlisting lives - in review, never in a workflow toggle. This
#      matters here because the tree is deliberately genericized: real
#      deployment values must never land in it at all.
#
# What it CANNOT do: block the push itself. A secret pushed to a branch is in
# the remote's object store - and on a public repo, public - by the time this
# runs. A finding here always means "rotate the credential", never just
# "amend the commit".
#
# Deliberately NOT gated on paths-filter: a credential can be pasted into a
# Markdown file, a .tfvars example, or a JSON fixture just as easily as into
# source. Every PR gets scanned, every time.
name: Secret Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Backstop: catch anything that reaches main another way, and give a manual
  # entry point for auditing the full history.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the entire history instead of just the new commits"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Pinned, with the checksum from the release's own checksums.txt. An
  # unpinned scanner is a scanner someone else controls.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Scan for committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the scan walks a commit range, and a shallow clone
          # has no merge base to walk back to.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full_history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "pull_request" ]]; then
            # Only the commits this PR adds. Scanning from the true merge base
            # (not base.sha, which drifts as main moves) keeps the result
            # stable across re-runs and stops a pre-existing finding on main
            # from failing an unrelated PR.
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            echo "log_opts=${merge_base}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "Scanning ${merge_base}..${HEAD_SHA} ($(git rev-list --count "${merge_base}..${HEAD_SHA}") commit(s))"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            # Always the full history, whatever the checkbox says: a manual
            # run has no push event and so no meaningful "new commits" range —
            # honoring FULL=false here used to produce an empty range that
            # scanned nothing and still reported success.
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "Scanning the full history"
          elif [[ "$EVENT" == "push" && "$BEFORE" =~ ^0+$ ]]; then
            # New branch: no meaningful "before". Scan everything.
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "Scanning the full history (new branch)"
          elif [[ -z "$BEFORE" ]]; then
            # No before-sha on this event shape; an empty left side would make
            # the range HEAD..HEAD and scan nothing. Fail safe: scan it all.
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "Scanning the full history (no before-sha on this event)"
          else
            echo "log_opts=${BEFORE}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Scanning ${BEFORE}..${GITHUB_SHA}"
          fi

      - name: gitleaks
        id: scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          # Actions invokes `run:` steps as `bash -e {0}`, so errexit is
          # already on and `set -uo pipefail` would NOT clear it — gitleaks
          # exiting 2 would abort the step before the exit code is classified.
          # Turn it off explicitly.
          set +e
          set -uo pipefail
          args=(git . --config .gitleaks.toml --redact
                --report-format json --report-path gitleaks-report.json
                --exit-code 2 --no-banner)
          if [[ -n "$LOG_OPTS" ]]; then
            args+=(--log-opts="$LOG_OPTS")
          fi

          gitleaks "${args[@]}"
          rc=$?

          # 0 = clean, 2 = findings (handled by the Report step so the summary
          # gets written either way). Anything else is the scanner itself
          # failing — a bad config or a broken download must never be
          # indistinguishable from "no secrets found".
          case "$rc" in
            0|2) exit 0 ;;
            *)   echo "::error::gitleaks exited $rc (scan error, not a finding)"; exit "$rc" ;;
          esac

      # --redact keeps the secret value out of the log; the report still names
      # the file, line and rule, which is all triage needs.
      - name: Report
        if: always()
        run: |
          set -euo pipefail
          count=0
          if [[ -s gitleaks-report.json ]]; then
            count="$(jq 'length' gitleaks-report.json)"
          fi

          if [[ "$count" == "0" ]]; then
            echo "### No credentials found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### ${count} potential credential(s) found"
            echo
            echo "| Rule | File | Line | Commit |"
            echo "|------|------|------|--------|"
            jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:8]) |"' \
              gitleaks-report.json
            echo
            echo "**This repo is public: a finding here means the value is already exposed.**"
            echo "Rotate the credential first, then remove it. Do not just amend the commit."
            echo
            echo "False positive? Add a \`gitleaks:allow\` comment on that line, or an"
            echo "allowlist entry in \`.gitleaks.toml\` — never disable the workflow."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::${count} potential credential(s) found — see the job summary."
          exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
