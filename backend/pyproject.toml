[project]
name = "airhead"
version = "0.1.0"
description = "Airhead Calendar - family calendar with an agentic interface"
requires-python = ">=3.12"
dependencies = [
    # The tool runner lives under client.beta.messages; keep this current enough
    # that `@beta_tool` and `tool_runner` exist.
    "anthropic>=0.116",
    "boto3>=1.35",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
